# ==============================================================================
# DISCORD LIVE REAL-TIME VOTING & STREAM OVERLAY - CONFIGURATION
# Secrets belong in .env, never here - this file is committed.
# ==============================================================================

server:
  host: "0.0.0.0"                     # bind address for the bot's embedded API (/api/*)
  port: 3000
  base_url: "http://localhost:3000"   # used to build session links in the embed

discord:
  command_prefix: "!vote"
  # Siapa yang boleh menjalankan !vote. Cukup salah satu terpenuhi.
  min_role_id: 112233445566778899   # semua role di atas/sejajar role ini boleh
  admin_role_ids:                   # daftar role tambahan (opsional)
    - 112233445566778899
  # Kosongkan untuk memakai stage channel tempat admin berada saat initiate
  target_stage_channel_id: 123456789012345678
  voice_gate_enabled: true   # voter harus berada di stage channel sesi ini

voting:
  min_duration_seconds: 10
  max_duration_seconds: 3600
  vote_mode: "ONE_TIME" # Options: ONE_TIME | COOLDOWN
  cooldown_seconds: 15
  candidate_colors:
    - "#06B6D4" # Cyan
    - "#FACC15" # Yellow
    - "#FB923C" # Orange
    - "#A855F7" # Purple
    - "#10B981" # Emerald
    - "#EC4899" # Pink
    - "#3B82F6" # Blue
    - "#84CC16" # Lime
